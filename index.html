<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow de Beauty</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">
        <span>GLOW</span>
        <small>de BEAUTY</small>
    </div>

    <div class="header-actions">
        <button id="languageBtn">RU</button>
        <button class="search-btn" onclick="openSearch()">Qidiruv</button>
    </div>
</header>

<section class="hero">
    <div class="hero-content">
        <p class="hero-small">GLOW DE BEAUTY</p>

        <h1 id="heroTitle">
            Go‘zallik va uslub<br>
            bir joyda
        </h1>

        <p id="heroText">
            Kiyimlar, make up va aksessuarlar
        </p>

        <button class="gold-btn" onclick="scrollToCategories()">
            Xarid qilish
        </button>
    </div>
</section>

<section class="categories" id="categories">

    <div class="section-title">
        <span id="categoryLabel">Kategoriyalar</span>
        <h2 id="categoryTitle">O‘zingizga mosini tanlang</h2>
    </div>

    <div class="category-grid">

        <button class="category-card" onclick="openCategory('clothes')">
            <div class="category-image clothes-image"></div>
            <div class="category-name">
                <span id="clothesText">Kiyimlar</span>
            </div>
        </button>

        <button class="category-card" onclick="openCategory('makeup')">
            <div class="category-image makeup-image"></div>
            <div class="category-name">
                <span id="makeupText">Make Up</span>
            </div>
        </button>

        <button class="category-card" onclick="openCategory('accessories')">
            <div class="category-image accessories-image"></div>
            <div class="category-name">
                <span id="accessoriesText">Aksessuarlar</span>
            </div>
        </button>

    </div>
</section>

<section class="products-section">

    <div class="section-heading">
        <div>
            <p class="small-title" id="saleSmall">MAXSUS TAKLIFLAR</p>
            <h2 id="saleTitle">Skidkadagi mahsulotlar</h2>
        </div>

        <button class="view-all" onclick="showAllProducts()">
            Barchasi
        </button>
    </div>

    <div class="products-grid" id="saleProducts">

        <!-- Mahsulotlar JavaScript orqali chiqadi -->

    </div>

</section>

<section class="products-section">

    <div class="section-heading">
        <div>
            <p class="small-title">NEW</p>
            <h2 id="newTitle">Yangi mahsulotlar</h2>
        </div>
    </div>

    <div class="products-grid" id="newProducts">

        <!-- Mahsulotlar JavaScript orqali chiqadi -->

    </div>

</section>

<div class="search-modal" id="searchModal">

    <div class="search-box">

        <button class="close-search" onclick="closeSearch()">×</button>

        <h2 id="searchTitle">Mahsulot qidirish</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Mahsulot nomini yozing..."
            oninput="searchProducts()"
        >

        <div id="searchResults"></div>

    </div>

</div>

<div class="cart-panel" id="cartPanel">

    <div class="cart-header">

        <h2 id="cartTitle">Savatcha</h2>

        <button onclick="closeCart()">×</button>

    </div>

    <div id="cartItems"></div>

    <div class="cart-bottom">

        <div class="total-row">
            <span id="totalText">Jami:</span>
            <strong id="cartTotal">0 so‘m</strong>
        </div>

        <button class="checkout-btn" onclick="checkout()">
            <span id="checkoutText">Buyurtma berish</span>
        </button>

    </div>

</div>

<div class="overlay" id="overlay" onclick="closePanels()"></div>

<nav class="bottom-nav">

    <button onclick="goHome()">
        <span class="nav-icon">⌂</span>
        <small id="homeNav">Bosh sahifa</small>
    </button>

    <button onclick="openCategory('clothes')">
        <span class="nav-icon">C</span>
        <small id="clothesNav">Kiyimlar</small>
    </button>

    <button onclick="openCategory('makeup')">
        <span class="nav-icon">M</span>
        <small id="makeupNav">Make Up</small>
    </button>

    <button onclick="openCategory('accessories')">
        <span class="nav-icon">A</span>
        <small id="accessoriesNav">Aksessuarlar</small>
    </button>

    <button onclick="openCart()">
        <span class="nav-icon cart-icon">
            Savat
            <b id="cartCount">0</b>
        </span>
        <small id="cartNav">Savatcha</small>
    </button>

</nav>

<script src="script.js"></script>

</body>
</html>
