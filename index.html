<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow de Beauty</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4fff8;
  color: #25352d;
}

.header {
  padding: 25px 20px 15px;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.subtitle {
  color: #789187;
  margin-top: 5px;
}

.search {
  margin: 15px 20px;
  background: white;
  padding: 14px;
  border-radius: 15px;
  color: #91a49a;
  box-shadow: 0 3px 12px #dceee4;
}

h2 {
  margin: 20px;
  font-size: 20px;
}

.categories {
  display: flex;
  gap: 10px;
  padding: 0 20px;
}

.category {
  flex: 1;
  background: #dff5e8;
  padding: 18px 5px;
  border-radius: 18px;
  text-align: center;
  font-weight: bold;
}

.products {
  display: flex;
  gap: 12px;
  padding: 0 20px;
  overflow-x: auto;
}

.product {
  min-width: 155px;
  background: white;
  border-radius: 18px;
  padding: 10px;
  box-shadow: 0 3px 12px #dceee4;
}

.product-image {
  height: 150px;
  background: #eaf8f0;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
}

.product-name {
  margin-top: 10px;
  font-weight: bold;
}

.code {
  color: #82978c;
  font-size: 12px;
  margin-top: 4px;
}

.price {
  margin-top: 8px;
  font-weight: bold;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  display: flex;
  justify-content: space-around;
  padding: 15px 5px;
  box-shadow: 0 -3px 15px #dceee4;
}

.bottom div {
  text-align: center;
  font-size: 13px;
}

.icon {
  font-size: 22px;
  margin-bottom: 3px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">Glow de Beauty 🎀</div>
  <div class="subtitle">Find your little glow ✨</div>
</div>

<div class="search">
  🔍 Mahsulot qidirish...
</div>

<h2>Kategoriyalar</h2>

<div class="categories">
  <div class="category">💄<br>CK</div>
  <div class="category">👗<br>KL</div>
  <div class="category">🎀<br>AK</div>
</div>

<h2>New In ✨</h2>

<div class="products">

  <div class="product">
    <div class="product-image">💄</div>
    <div class="product-name">Beauty Product</div>
    <div class="code">CK-001</div>
    <div class="price">149 000 so'm</div>
  </div>

  <div class="product">
    <div class="product-image">👜</div>
    <div class="product-name">Mini Bag</div>
    <div class="code">AK-001</div>
    <div class="price">179 000 so'm</div>
  </div>

  <div class="product">
    <div class="product-image">👗</div>
    <div class="product-name">Trendy Dress</div>
    <div class="code">KL-001</div>
    <div class="price">249 000 so'm</div>
  </div>

</div>

<div class="bottom">
  <div>
    <div class="icon">🏠</div>
    Bosh sahifa
  </div>

  <div>
    <div class="icon">🛍️</div>
    Katalog
  </div>

  <div>
    <div class="icon">🛒</div>
    Savatcha
  </div>

  <div>
    <div class="icon">📦</div>
    Buyurtmalar
  </div>
</div>

</body>
</html>
